# Her gönderimde ve çekme isteğinde Dart ve Android birim testlerini çalıştırır.
# Windows'ta Akıllı Uygulama Denetimi (Smart App Control) imzasız
# flutter_tester.exe'yi engelleyebiliyor; testlerin güvenilir sonucu buradan gelir.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testler
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Bağımlılıklar
        run: flutter pub get

      - name: Analiz
        # material.dart -> material_ui geçişi bilgi notları uyarı sayılmaz.
        run: flutter analyze --no-fatal-infos

      - name: Dart testleri
        run: flutter test

      - name: TDLib (resmi kaynaktan derlenmiş, SHA256 doğrulamalı)
        run: bash scripts/tdlib_indir.sh

      - name: Debug APK (Gradle sarmalayıcısını ve local.properties'i de üretir)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Android birim testleri (Robolectric)
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Başarısız testleri özetle
        if: failure()
        # Her başarısız test, adı ve hatasının ilk satırlarıyla iş özetinde görünür.
        run: |
          python3 - <<'EOF'
          import glob
          import xml.etree.ElementTree as ET

          def prop(value):
              return value.replace('%', '%25').replace('\r', '').replace('\n', '%0A').replace(':', '%3A').replace(',', '%2C')

          for path in sorted(glob.glob('build/app/test-results/testDebugUnitTest/*.xml')):
              suite = ET.parse(path).getroot()
              for case in suite.iter('testcase'):
                  for bad in case.findall('failure') + case.findall('error'):
                      lines = (bad.text or bad.get('message') or '').strip().splitlines()[:12]
                      message = '\n'.join(lines).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                      title = prop(f"{suite.get('name', '').rsplit('.', 1)[-1]} > {case.get('name', '')}")
                      print(f'::error title={title}::{message}')
          EOF

      - name: Test raporları
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: build/app/reports/tests/
          if-no-files-found: ignore
